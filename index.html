<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Private Video Streamer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        text-align: center;
        padding: 40px;
    }

    select {
        padding: 10px;
        font-size: 16px;
        margin-bottom: 20px;
        width: 300px;
    }

    iframe {
        width: 80%;
        max-width: 900px;
        height: 500px;
        border: none;
        border-radius: 10px;
        background: black;
    }
</style>
</head>

<body>

<h1>My Video Library</h1>

<select id="videoSelect">
    <option value="">-- Select a Video --</option>
</select>

<br>

<iframe id="videoFrame" allow="autoplay" allowfullscreen></iframe>

<script>
const select = document.getElementById("videoSelect");
const frame = document.getElementById("videoFrame");

// Load videos from JSON file
fetch("videos.json")
    .then(response => response.json())
    .then(videos => {
        videos.forEach(video => {
            const option = document.createElement("option");
            option.value = video.id;
            option.textContent = video.title;
            select.appendChild(option);
        });
    });

// Update video when selected
select.addEventListener("change", function() {
    if (this.value) {
        frame.src = `https://drive.google.com/file/d/${this.value}/preview`;
    } else {
        frame.src = "";
    }
});
</script>

</body>
</html>
