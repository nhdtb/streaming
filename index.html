<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Private Video Streamer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
        padding: 20px;
    }

    h1 {
        font-size: 22px;
        margin-bottom: 20px;
    }

    select {
        width: 100%;
        max-width: 500px;
        padding: 14px;
        font-size: 18px;
        border-radius: 8px;
        border: none;
        margin-bottom: 20px;
    }

    /* Responsive 16:9 video container */
    .video-container {
        position: relative;
        width: 100%;
        max-width: 1000px;
        margin: auto;
        padding-bottom: 56.25%; /* 16:9 ratio */
        height: 0;
    }

    .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 12px;
        background: black;
    }
</style>
</head>

<body>

<h1>My Video Library</h1>

<select id="videoSelect">
    <option value="">-- Select a Video --</option>
</select>

<div class="video-container">
    <iframe
        id="videoFrame"
        allow="autoplay; fullscreen"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen>
    </iframe>
</div>

<script>
const select = document.getElementById("videoSelect");
const frame = document.getElementById("videoFrame");

// Load videos
fetch("videos.json")
    .then(response => response.json())
    .then(videos => {
        videos.forEach(video => {
            const option = document.createElement("option");
            option.value = video.id;
            option.textContent = video.title;
            select.appendChild(option);
        });
    });

// Change video
select.addEventListener("change", function() {
    if (this.value) {
        frame.src = `https://drive.google.com/file/d/${this.value}/preview`;
    } else {
        frame.src = "";
    }
});
</script>

</body>
</html>
